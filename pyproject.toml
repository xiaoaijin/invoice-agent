[project]
name = "invoice-agent"
version = "0.1.0"
description = "发票助手 Agent：识票、验真、风控、政策问答"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "rank-bm25>=0.2",
    "jieba>=0.42",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "streamlit>=1.37",
    "pillow>=10.3",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实 API key 与网络的集成测试（默认跳过，用 --integration 运行）",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    "C408",  # dict(**kw) 写法便于测试中的 override 模式
    "RUF046",
]
