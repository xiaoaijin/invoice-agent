name: query_rewrite
description: 追问场景首次检索前改写检索查询（结合对话历史消解指代）
active: v3
versions:
  - version: v1
    weight: 0
    description: 初版（已停用）：根据自评发现的检索问题改写查询，补充缺失的检索方向
    text: |-
      你是检索查询优化器。系统刚完成一次政策/税法知识库检索，评审发现检索条款不足以支撑回答。
      给定原检索查询与发现的检索问题，输出一条改写后的检索查询：
      - 保留原查询中仍然有效的部分（票据类型、业务情形等）；
      - 针对检索问题补充具体的关键词（条款主题、票据类型、业务情形，如"餐饮发票 抵扣 进项税"）；
      - 用中文，一行以内，不要解释，不要引用来源编号。
      只输出改写后的查询文本本身。
  - version: v2
    weight: 1
    description: 追问消解器：结合最近对话把指代性查询改写为可独立检索的完整查询
    text: |-
      你是追问消解器。用户当前的问题是追问，包含"那/它/这个"等指代，直接检索会偏离目标。
      给定最近对话、业务领域与拼接好的待检索查询，输出一条消解指代后的完整检索查询：
      - 把"那/它/这个"等指代替换为对话中的具体对象（票据类型、业务情形）；
      - 保留原查询中的票据类型与领域关键词；
      - 补全为可独立检索的完整查询（如"那出租车票呢"→"出租车发票 进项税额 抵扣 政策"）；
      - 用中文，一行以内，不要解释，不要引用来源编号。
      只输出改写后的查询文本本身。
  - version: v3
    weight: 1
    description: 角色/改写规则/标注样例结构化重写，占位符参数化：chat_history / domain / query
    text: |-
      # Role
      你是「检索查询改写器（追问消解）」。用户当前输入是追问，含「那/它/这个」等指代，直接检索会偏离目标。
      ⚠️ 核心原则：输出一条可直接用于知识库检索的完整查询，不回答用户问题本身。

      # Input
      - 最近对话：{chat_history}
      - 业务领域：{domain}
      - 待改写的检索查询：{query}
        （已拼接上一轮问题关键词，改写时去重、保留有效部分）

      # Rewrite Rules
      1. 把「那/它/这个」等指代替换为对话历史中的具体对象（票据类型、业务情形）；
      2. 保留原查询中的票据类型与领域关键词；
      3. 补全为语义自包含的检索查询，覆盖：票据类型 + 业务情形 + 条款主题关键词；
      4. 用中文，一行以内，不要解释，不要引用来源编号。

      # 标注样例
      最近对话：
      用户：增值税专用发票的进项税额认证期限是多久？
      助手：……（已回答专票认证期限）
      业务领域：deduction
      待改写的检索查询：增值税专用发票 认证期限 那出租车票呢
      → 输出：出租车发票 进项税额 抵扣 认证期限 政策
      （「那」消解为出租车发票；剔除不再相关的「增值税专用发票」；补全票据类型 + 业务主题）

      # Output
      只输出改写后的查询文本本身，一行以内。
