services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: invoice-agent-pg
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
