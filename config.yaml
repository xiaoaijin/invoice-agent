# 业务配置（非密钥）。公司抬头/税号、风控阈值、敏感词表等
company:
  name: "示例科技有限公司"
  tax_id: "91330100MA27XXXXXX"

risk:
  serial_gap_tolerance: 5        # 连号判定：同销售方发票号差值 ≤ N 视为连号
  split_amount_threshold: 5000   # 大额拆分：累计金额阈值（元）
  split_window_days: 7           # 拆分判定时间窗口（天）
  split_min_count: 3             # 拆分判定最少张数
  reimburse_deadline_days: 90    # 报销时效（天）
  confidence_threshold: 0.8      # 低于此置信度提示人工复核
  sensitive_keywords:
    - "礼品卡"
    - "购物卡"
    - "储值卡"
    - "预付卡"
    - "烟"
    - "酒"
    - "高档"

paths:
  db: "data/invoice_agent.db"
  knowledge_dir: "knowledge"

context:
  token_budget: 8000          # 单次 LLM 交互 token 上限（字符估算）
  compress_threshold: 0.6     # 历史 token 达预算 60% 时触发摘要压缩
  keep_recent_rounds: 10      # 压缩时原样保留最近 N 轮，更早的进摘要

memory:
  enabled: true               # PG 不可用时自动降级为无长期记忆
  recall_top_k: 5             # 语义召回相关历史记忆条数

monitoring:
  enabled: true               # 全流程监控总开关
  db: "data/monitor.db"       # 监控 trace 独立 SQLite（与去重库分离，可随时删除）
  log_level: "INFO"
  log_file: "logs/agent.log"  # 结构化日志（RotatingFileHandler 5MB×3）
  pricing:                    # 每千 token 成本（元），未配置的模型不计成本
    qwen3.5-omni-plus: { input: 0.007, output: 0.04 }  # 文本/图片输入 7 元/M，文本输出 40 元/M（无音频路径）
    qwen3.7-text-embedding: { input: 0.0005, output: 0.0 }  # 文本输入 0.5 元/M（Batch File 0.25 元/M 未单独计价）
  alert:
    node_latency_budget_ms:   # 节点延迟预算（毫秒），未列出的用 default
      default: 10000
      recognize: 25000
      finalize: 15000
      retrieve_docs: 3000
    run_latency_budget_ms: 60000
    max_retries_per_run: 2    # 单次 run 内同节点重复执行超此数告警
    success_rate_window: 20   # 近 N 次 run 的成功率窗口
    min_success_rate: 0.9

feedback:
  answer:                     # 回答质量自评环路
    enabled: true
    max_retries: 1            # 不合格时最多重生成次数
    pass_score: 0.7           # 综合评分 ≥ 此值视为合格
  field_check:
    enabled: true             # 识票字段 LLM 级自检（复用提取重试边）
  risk_review:
    enabled: true             # 风控结论 LLM 复核（误报移除/漏报补充，单次修订不回环）

prompts:
  dir: "prompts"              # prompt YAML 目录（相对项目根）
  ab_enabled: false           # A/B 抽样总开关：true 时按各版本 weight 加权抽样
  overrides: {}               # 强制指定版本，优先级最高，如 qa: v2
