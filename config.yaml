# 业务配置（非密钥）。公司抬头/税号、风控阈值、敏感词表等
company:
  name: "示例科技有限公司"
  tax_id: "91330100MA27XXXXXX"

risk:
  serial_gap_tolerance: 5        # 连号判定：同销售方发票号差值 ≤ N 视为连号
  split_amount_threshold: 5000   # 大额拆分：累计金额阈值（元）
  split_window_days: 7           # 拆分判定时间窗口（天）
  split_min_count: 3             # 拆分判定最少张数
  reimburse_deadline_days: 90    # 报销时效（天）
  confidence_threshold: 0.8      # 低于此置信度提示人工复核
  sensitive_keywords:
    - "礼品卡"
    - "购物卡"
    - "储值卡"
    - "预付卡"
    - "烟"
    - "酒"
    - "高档"

paths:
  db: "data/invoice_agent.db"
  knowledge_dir: "knowledge"

upload:
  max_size_mb: 10             # 上传文件大小上限（UI/API 入口与 intake 双重校验）
  max_pdf_pages: 5            # PDF 只取前 N 页转图（防大文件爆内存）
  allowed_extensions: [".png", ".jpg", ".jpeg", ".pdf"]
  image_max_long_edge_px: 2200  # 识票前长边缩放上限（vision 输入 token 随像素数涨）
  image_jpeg_quality: 85      # 识票前统一 JPEG 有损重编码质量（原 PNG 强转体积更大）
  pdf_render_dpi: 150         # PDF 逐页渲染 DPI（intake 转图用）

context:
  token_budget: 8000          # 单次 LLM 交互 token 上限（字符估算）
  compress_threshold: 0.6     # 历史 token 达预算 60% 时触发摘要压缩
  keep_recent_rounds: 10      # 压缩时原样保留最近 N 轮，更早的进摘要

reimburse:
  title_prefix: "员工费用报销"   # 批次标题前缀（UI 可覆盖）
  categories:                    # 与 ExpenseCategory 枚举值一致（test_expense_models 把关）
    - "交通"
    - "餐饮"
    - "住宿"
    - "办公用品"
    - "其他"

memory:
  enabled: true               # PG 不可用时自动降级为无长期记忆
  recall_top_k: 5             # 语义召回相关历史记忆条数

checkpointer:
  backend: "postgres"         # memory=进程内（单测/演示）；postgres=跨进程/跨重启，PG 不可用则启动报错
  # dsn: 留空复用 .env 的 PG_DSN

intent:
  enabled: true               # 意图识别漏斗总开关（关闭时所有问题按新问题处理，不调 LLM）
  llm_fallback: true          # 关键词/正则均未定性时是否允许 LLM 兜底
  chat_keywords:              # 寒暄/闲聊关键词（子串匹配，命中即跳过检索）
    - "你好"
    - "在吗"
    - "谢谢"
    - "辛苦"
    - "再见"
    - "你是谁"
    - "嗨"
  no_retrieval_keywords:      # 免检索关键词（子串匹配：纯复述上文、无需任何外部信息的请求；表须极窄防误伤）
    - "再说一遍"
    - "再重复一遍"
    - "重复一遍"
    - "再讲一遍"
  domain_keywords:            # 业务领域打标（零成本，命中最多的领域胜出）
    policy: ["政策", "规定", "文件", "税法", "标准"]
    header: ["抬头", "税号", "开票信息", "开票名称"]
    deduction: ["抵扣", "进项", "税前扣除", "专票抵扣"]
    reimburse: ["报销", "贴票", "报销流程", "报销时效"]
    verify: ["查验", "验真", "真伪", "查验平台"]

monitoring:
  enabled: true               # 全流程监控总开关
  db: "data/monitor.db"       # 监控 trace 独立 SQLite（与去重库分离，可随时删除）
  log_level: "INFO"
  log_file: "logs/agent.log"  # 结构化日志（RotatingFileHandler 5MB×3）
  pricing:                    # 每千 token 成本（元），未配置的模型不计成本
    qwen3.5-omni-plus: { input: 0.007, output: 0.04 }  # 文本/图片输入 7 元/M，文本输出 40 元/M（无音频路径）
    qwen3.8-max: { input: 0.0024, output: 0.0096 }  # TODO: 占位价格（沿 qwen-max 档），待按百炼定价页核实
    qwen3.7-text-embedding: { input: 0.0005, output: 0.0 }  # 文本输入 0.5 元/M（Batch File 0.25 元/M 未单独计价）
  alert:
    node_latency_budget_ms:   # 节点延迟预算（毫秒），未列出的用 default
      default: 10000
      recognize: 25000
      finalize: 15000
      retrieve_docs: 10000     # 首检轮含追问场景的 LLM 查询改写调用，预算需覆盖之
      intent: 3000             # 意图识别（关键词/正则层微秒级，预算覆盖 LLM 兜底轮）
    run_latency_budget_ms: 60000
    max_retries_per_run: 2    # 单次 run 内同节点重复执行超此数告警
    success_rate_window: 20   # 近 N 次 run 的成功率窗口
    min_success_rate: 0.9

feedback:
  answer:                     # 回答质量自评环路
    enabled: true
    max_retries: 1            # 不合格时最多重生成次数
    pass_score: 0.7           # 综合评分 ≥ 此值视为合格
  field_check:
    enabled: true             # 识票字段 LLM 级自检（复用提取重试边）
  risk_review:
    enabled: true             # 风控结论 LLM 复核（误报移除/漏报补充，单次修订不回环）
  lessons:                    # 自评教训持久化（pgvector），供后续运行召回优化
    enabled: true
    recall_top_k: 3           # 相似问题召回的教训条数
    min_score: 0.6            # 余弦相似度阈值，低于此不注入

prompts:
  dir: "prompts"              # prompt YAML 目录（相对项目根）
  ab_enabled: false           # A/B 抽样总开关：true 时按各版本 weight 加权抽样
  overrides: {}               # 强制指定版本，优先级最高，如 qa: v2
